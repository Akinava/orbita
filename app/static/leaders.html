<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Orbita — leaderboard</title>
  <style>
    :root { --fg: #bfefff; --accent: #28d7ff; --bg: rgba(2, 10, 18, 0.92); --warn: #ffb36b; --line: #1d5a6c; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; color: var(--fg); }
    body {
      display: flex; padding: 16px; box-sizing: border-box; min-height: 100vh; min-height: 100dvh;
      background: radial-gradient(ellipse at 30% 20%, #0b2a3a 0%, #02060c 55%, #000 100%);
    }
    .panel {
      margin: auto; width: 100%; max-width: 760px; box-sizing: border-box; background: var(--bg);
      border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: 0 0 40px rgba(40, 215, 255, 0.15);
    }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    h1 { margin: 0; letter-spacing: 0.35em; color: var(--accent); font-weight: 800; font-size: 30px; }
    h1 a { color: inherit; text-decoration: none; }
    h2 { margin: 0 0 16px; font-size: 18px; text-transform: uppercase; letter-spacing: 0.12em; color: #fff; font-weight: 700; }
    .lang { display: flex; gap: 4px; }
    button, .btn {
      font: inherit; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--accent); background: #07303d; color: #e8fbff; text-decoration: none; text-align: center;
      box-sizing: border-box; display: inline-block;
    }
    button:hover:not(:disabled), .btn:hover { background: #0b4a5e; }
    .lang button { font-size: 13px; padding: 6px 10px; background: transparent; opacity: 0.6; }
    .lang button.active { background: #07303d; opacity: 1; }
    .ghost { background: transparent; border-color: var(--line); }

    table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
    th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7;
      text-align: right; padding: 0 8px 8px; white-space: nowrap;
    }
    td { padding: 7px 8px; border-top: 1px solid rgba(29, 90, 108, 0.5); text-align: right; white-space: nowrap; }
    th.pilot, td.pilot { text-align: left; width: 100%; }
    td.rank { color: #fff; font-weight: 700; width: 2.5em; }
    tr.top1 td.rank { color: #ffd24a; } tr.top2 td.rank { color: #d9e4ec; } tr.top3 td.rank { color: #e0955a; }
    td.active { color: #fff; font-weight: 700; }
    th.active { opacity: 1; color: var(--accent); }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { font-size: 14px; padding: 8px 14px; background: transparent; border-color: var(--line); opacity: 0.75; }
    .tabs button.active { background: #07303d; border-color: var(--accent); opacity: 1; }
    tr.mine td { background: rgba(40, 215, 255, 0.12); }
    tr.gap td { border: 0; padding: 2px; text-align: center; opacity: 0.5; }
    .pilot a { display: flex; align-items: center; gap: 10px; color: #e8fbff; text-decoration: none; font-weight: 600; min-width: 0; }
    .pilot a:hover span { text-decoration: underline; }
    .pilot span { overflow: hidden; text-overflow: ellipsis; }
    .ava {
      flex: none; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 800; color: #fff; border: 1px solid var(--line);
    }
    .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 560px) {
      .panel { padding: 16px; }
      .stat:not(.active) { display: none; } /* only the column of the open board */
      .tabs button { flex: 1; font-size: 13px; padding: 8px 4px; }
      td, th { padding-left: 5px; padding-right: 5px; }
    }
    .msg { min-height: 1.3em; margin: 14px 0 0; font-size: 14px; line-height: 1.4; }
    .msg.error { color: var(--warn); }
    .foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .hidden { display: none !important; }

  </style>
</head>
<body data-title="leaders.title">
  <main class="panel">
    <div class="head">
      <h1><a href="/" data-i18n="menu.title">ORBITA</a></h1>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="ru">RU</button>
      </div>
    </div>
    <h2 id="heading" data-i18n="leaders.heading"></h2>
    <div class="tabs" role="tablist">
      <button data-board="xp" data-i18n="leaders.byXp"></button>
      <button data-board="flight" data-i18n="leaders.byFlight"></button>
      <button data-board="wins" data-i18n="leaders.byWins"></button>
    </div>

    <table id="table" class="hidden">
      <thead>
        <tr>
          <th>#</th>
          <th class="pilot" data-i18n="leaders.pilot"></th>
          <th class="stat" data-col="xp" data-i18n="profile.xp"></th>
          <th class="stat" data-col="flight" data-i18n="profile.flight"></th>
          <th class="stat" data-col="wins" data-i18n="profile.wins"></th>
          <th class="stat" data-col="losses" data-i18n="profile.losses"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="status" class="msg" data-i18n="leaders.loading"></p>

    <div class="foot">
      <a class="btn" href="/" data-i18n="auth.toGame"></a>
      <a class="btn ghost hidden" id="myprofile" href="/profile.html" data-i18n="profile.mine"></a>
      <a class="btn ghost hidden" id="signin" href="/login.html?next=/leaders.html" data-i18n="menu.signIn"></a>
    </div>
  </main>

  <script type="module" src="js/leaders.js"></script>
</body>
</html>
