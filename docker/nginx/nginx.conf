# nginx in front of the game (service "nginx" in docker/game/docker-compose.yml): terminates TLS, sends
# the multiplayer WebSocket /ws?map=<id> to the shard process that hosts that map (the id starts with
# the shard's name) and everything else (the game files, /api, /ice) to "web". Each shard uses one CPU
# core of its own.

worker_processes auto;

events {
    worker_connections 4096;  # a pilot takes two: to the browser and to the map process
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream web { server web:8000; }
    upstream map_alpha { server map-alpha:8000; }
    upstream map_beta { server map-beta:8000; }
    upstream map_gamma { server map-gamma:8000; }

    # Same shards as ORBITA_SHARDS of "web"; an unknown map goes to alpha, which refuses it
    map $arg_map $map_server {
        default map_alpha;
        ~^alpha- map_alpha;
        ~^beta- map_beta;
        ~^gamma- map_gamma;
    }

    # Rate limits per client address against crawling the public pilot data: profiles and leaderboards,
    # and avatars (a leaderboard page loads up to a hundred at once, so they get a larger allowance).
    # Over the limit the answer is 429.
    limit_req_zone $binary_remote_addr zone=pilots:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=avatars:10m rate=20r/s;
    # Creating maps (POST /api/maps): a few a minute per address; other requests have no key, so no limit
    map $request_method $map_creator {
        POST $binary_remote_addr;
        default "";
    }
    limit_req_zone $map_creator zone=create:10m rate=6r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 ssl;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /ws {
            proxy_pass http://$map_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;  # clients report 15 times a second; this only catches dead links
            proxy_send_timeout 1h;
        }

        location ~ ^/api/(profile|leaders|maps)(/[^/]+)?$ {
            limit_req zone=pilots burst=20 nodelay;
            limit_req zone=create burst=3 nodelay;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # The shards' map lists and map creation are for "web" only
        location /internal/ {
            return 404;
        }

        location /avatar/ {
            limit_req zone=avatars burst=120 nodelay;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # client address for captcha checks
        }
    }
}
