# coturn for the game's voice chat (WebRTC relay when a direct connection is impossible).
# The shared secret, the realm (TURN_HOST), the addresses and the TLS files are passed on the command
# line by docker-compose.yml (see shadow/turn.env).

# TURN REST API: the game server hands out logins "<expiry>:<player>" signed with the shared secret
use-auth-secret

listening-port=3478
tls-listening-port=5349
# Relayed media; forward these UDP ports on the router too
min-port=49160
max-port=49200

fingerprint
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
stale-nonce=600
# Per-user and total limits: voice only needs a few streams
user-quota=12
total-quota=100
max-bps=200000

# Never relay into private networks: the server must not become a way into the LAN
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
